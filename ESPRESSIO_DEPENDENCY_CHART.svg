<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><style>text{font-family:Arial,sans-serif;fill:#111}.t{font-size:26px;font-weight:700}.n{fill:#fff;stroke:#222;stroke-width:2}.l{font-size:15px;text-anchor:middle}.e{stroke:#222;stroke-width:2;fill:none;marker-end:url(#a)}.o{stroke-dasharray:7 6}.note{font-size:13px}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs><text class="t" x="30" y="40">ESPressio WiFi 0.1.0 — Dependency Architecture</text><rect class="n" x="390" y="80" width="220" height="60" rx="8"/><text class="l" x="500" y="116">WiFi 0.1.0</text><rect class="n" x="80" y="220" width="190" height="60" rx="8"/><text class="l" x="175" y="255">Observable 3.0.2</text><rect class="n" x="300" y="220" width="190" height="60" rx="8"/><text class="l" x="395" y="255">Serializable 0.11.0</text><rect class="n" x="520" y="220" width="190" height="60" rx="8"/><text class="l" x="615" y="255">Persistence 0.3.0</text><rect class="n" x="740" y="220" width="190" height="60" rx="8"/><text class="l" x="835" y="255">Security 0.4.0</text><rect class="n" x="230" y="370" width="180" height="60" rx="8"/><text class="l" x="320" y="405">Event 6.0.1</text><rect class="n" x="590" y="370" width="180" height="60" rx="8"/><text class="l" x="680" y="405">Command 1.0.1</text><path class="e" d="M450 140 L210 220"/><path class="e" d="M485 140 L410 220"/><path class="o e" d="M535 140 L600 220"/><path class="o e" d="M570 140 L800 220"/><path class="o e" d="M460 140 L340 370"/><path class="o e" d="M540 140 L660 370"/><text class="note" x="30" y="475">Solid = required. Dashed = opt-in. Serial may consume WiFi; WiFi never consumes Serial. Web remains a separate higher-order library.</text></svg>
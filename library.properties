name=ESPressio-WiFi
version=0.2.1
author=Simon J. Stuart
maintainer=Simon J. Stuart
sentence=Autonomous platform-neutral WiFi management with remembered-network selection and conditional AP fallback for ESPressio.
paragraph=Provides Serializable WiFi configuration, prioritized remembered Client networks with automatic scan/select/failover, APUntilClient IoT fallback behaviour, independent Access Point and Client state models, ESP32 implementation, PrecisionThread autonomous runtime, DHCP/static addressing, Observable notifications, and optional Persistence, Security, Event and Command integrations.
category=Communication
url=https://espressio.org
architectures=esp32
includes=ESPressio_WiFi.hpp,ESPressio_WiFiWorker.hpp
depends=ESPressio-Observable (>=3.0.2 && <4.0.0),ESPressio-Serializable (>=0.11.3 && <1.0.0),ESPressio-Threads (>=3.1.7 && <4.0.0)

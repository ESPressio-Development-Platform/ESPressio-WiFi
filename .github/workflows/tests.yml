name: WiFi Tests
on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: project/ESPressio-WiFi}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: pip install platformio
      - name: Create integration consumer
        run: |
          mkdir -p project/consumer/src
          cat > project/consumer/network_include.py <<'EOF'
          Import("env")
          framework = env.PioPlatform().get_package_dir("framework-arduinoespressif32")
          env.Append(CPPPATH=[framework + "/libraries/Network/src"])
          EOF
          cat > project/consumer/platformio.ini <<'EOF'
          [env:esp32]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          extra_scripts = pre:network_include.py
          build_flags = -std=gnu++17 -fno-rtti -DESPRESSIO_SERIALIZATION_PREFER_PSRAM
          build_unflags = -std=gnu++11 -frtti
          lib_ldf_mode = deep+
          lib_deps =
              ../ESPressio-WiFi
              https://github.com/ESPressio-Development-Platform/ESPressio-System.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Serializable.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Units.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Task.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Threads.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Persistence.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Security.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Event.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-Command.git#structural_realignment
              https://github.com/ESPressio-Development-Platform/ESPressio-ESP32.git#structural_realignment
          EOF
          cat > project/consumer/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <Network.h>
          #include <WiFi.h>
          #include <ESPressio_ESP32.hpp>
          #include <ESPressio_WiFiPlatform.hpp>
          #include <ESPressio_WiFiWorker.hpp>
          #include <ESPressio_WiFiPersistence.hpp>
          #include <ESPressio_WiFiPersistenceSecurity.hpp>
          #include <ESPressio_WiFiEventBridge.hpp>
          #include <ESPressio_WiFiCommandHandler.hpp>
          using namespace ESPressio;
          WiFi::WiFiPlatform platform;
          WiFi::WiFiManager manager(platform);
          WiFi::WiFiWorker worker(manager);
          WiFi::WiFiCommandHandler commands;
          Event::WiFiEventBridge events;
          void setup(){ ESP32Platform::InstallSystemProviders(); WiFi::WiFiConfiguration config; config.Mode=WiFi::WiFiMode::APUntilClient; config.AccessPoint.SSID="ESPressio-Test"; config.Client.Enabled=true; WiFi::ClientNetworkProfile preferred; preferred.SSID="Preferred"; preferred.Password="password123"; preferred.Priority=200; config.Client.Networks.push_back(std::move(preferred)); (void)manager.Configure(std::move(config)); (void)commands.Initialize(Command::CommandRegistry::GetInstance(),manager); (void)events.Initialize(manager); (void)worker.Initialize(); (void)worker.Start(); }
          void loop(){delay(1000);}
          EOF
      - run: pio run -d project/consumer

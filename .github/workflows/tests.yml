name: WiFi Tests

on:
  push:
    branches: [main, 'feature/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  esp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project/ESPressio-WiFi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - name: Create integration consumer
        run: |
          mkdir -p project/consumer/src
          cat > project/consumer/network_include.py <<'EOF'
          Import("env")
          framework = env.PioPlatform().get_package_dir("framework-arduinoespressif32")
          env.Append(CPPPATH=[framework + "/libraries/Network/src"])
          EOF
          cat > project/consumer/platformio.ini <<'EOF'
          [env:esp32]
          platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
          board = esp32dev
          framework = arduino
          extra_scripts = pre:network_include.py
          build_flags = -std=gnu++17 -frtti
          build_unflags = -std=gnu++11 -fno-rtti
          lib_ldf_mode = deep+
          lib_deps =
              ../ESPressio-WiFi
              https://github.com/ESPressio-Development-Platform/ESPressio-Observable.git#3.0.2
              https://github.com/ESPressio-Development-Platform/ESPressio-Serializable.git#0.11.3
              https://github.com/ESPressio-Development-Platform/ESPressio-Units.git#0.2.7
              https://github.com/ESPressio-Development-Platform/ESPressio-Timing.git#2.2.8
              https://github.com/ESPressio-Development-Platform/ESPressio-Threads.git#3.1.7
              https://github.com/ESPressio-Development-Platform/ESPressio-Persistence.git#0.3.2
              https://github.com/ESPressio-Development-Platform/ESPressio-Security.git#0.4.2
              https://github.com/ESPressio-Development-Platform/ESPressio-Event.git#6.0.3
              https://github.com/ESPressio-Development-Platform/ESPressio-Command.git#1.0.3
          EOF
          cat > project/consumer/src/main.cpp <<'EOF'
          #include <Arduino.h>
          #include <Network.h>
          #include <WiFi.h>
          #include <ESPressio_ESP32WiFi.hpp>
          #include <ESPressio_WiFiWorker.hpp>
          #include <ESPressio_WiFiPersistence.hpp>
          #include <ESPressio_WiFiPersistenceSecurity.hpp>
          #include <ESPressio_WiFiEventBridge.hpp>
          #include <ESPressio_WiFiCommandHandler.hpp>
          using namespace ESPressio;
          WiFi::ESP32WiFiPlatform platform;
          WiFi::WiFiManager manager(platform);
          WiFi::WiFiWorker worker(manager);
          WiFi::WiFiCommandHandler commands;
          Event::WiFiEventBridge events;
          void setup() {
              WiFi::WiFiConfiguration config;
              config.Mode = WiFi::WiFiMode::APUntilClient;
              config.AccessPoint.SSID = "ESPressio-Test";
              config.Client.Enabled = true;
              WiFi::ClientNetworkProfile preferred;
              preferred.SSID = "Preferred";
              preferred.Password = "password123";
              preferred.Priority = 200;
              config.Client.Networks.push_back(preferred);
              (void)manager.Configure(config);
              (void)commands.Initialize(Command::CommandRegistry::GetInstance(), manager);
              (void)events.Initialize(manager);
              (void)worker.Initialize();
              (void)worker.Start();
          }
          void loop() { delay(1000); }
          EOF
      - run: pio run -d project/consumer
